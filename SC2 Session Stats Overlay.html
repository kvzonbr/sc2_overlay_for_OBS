<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SC2 Session Stats</title>
<!-- ==========================================================================
     CONFIGURACION DEL EQUIPO
     ==========================================================================
     Para que este overlay funcione durante el casteo de torneos (donde se
     mezclan partidas de distintos jugadores), cada miembro del equipo debe
     indicar aqui SU propio nombre de usuario de SC2 exactamente como aparece
     en el juego (respetando mayusculas/minusculas y caracteres especiales).

     El overlay usara este nombre para identificar cual de los dos jugadores
     de cada partida es "el nuestro" y así sumar correctamente victorias,
     derrotas y el desglose contra cada raza, sin importar si el jugador
     configurado aparece como players[0] o players[1] en los datos de SC2.

     INSTRUCCIONES PARA EL EQUIPO:
     1. Cambia el valor de MY_PLAYER_NAME abajo por tu propio usuario de SC2.
     2. Guarda el archivo.
     3. Listo, el resto del overlay funciona igual para todos.
     ========================================================================== -->
<script>
  const MY_PLAYER_NAME = "Kvzonbr"; // <-- CAMBIA ESTO por tu usuario de SC2
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<!-- El CSS del overlay ahora vive en style.css, en la misma carpeta que este archivo -->
<link rel="stylesheet" href="style.css">

</head>
<body>

<div id="panel">
  <div id="header">
    <div id="title"><span id="api-dot"></span><span id="title-text">Jornada</span></div>
    <div id="header-buttons">
      <button id="edit-btn" onclick="toggleEditPanel()" title="Ajustar contadores manualmente">&#9998;</button>
      <button id="reset-btn" onclick="resetSession()">Reset</button>
    </div>
  </div>

  <div id="edit-panel" class="hidden">
    <div class="edit-row">
      <span class="edit-lbl">Ganadas</span>
      <button class="edit-btn-sm" onclick="adjustStat('wins', -1)">-</button>
      <button class="edit-btn-sm" onclick="adjustStat('wins', 1)">+</button>
    </div>
    <div class="edit-row">
      <span class="edit-lbl">Perdidas</span>
      <button class="edit-btn-sm" onclick="adjustStat('losses', -1)">-</button>
      <button class="edit-btn-sm" onclick="adjustStat('losses', 1)">+</button>
    </div>
    <div class="edit-row edit-sub">vs Terran</div>
    <div class="edit-row">
      <span class="edit-lbl">G / P</span>
      <button class="edit-btn-sm" onclick="adjustRace('T','w',-1)">-</button>
      <button class="edit-btn-sm" onclick="adjustRace('T','w',1)">+</button>
      <span class="edit-sep">/</span>
      <button class="edit-btn-sm" onclick="adjustRace('T','l',-1)">-</button>
      <button class="edit-btn-sm" onclick="adjustRace('T','l',1)">+</button>
    </div>
    <div class="edit-row edit-sub">vs Protoss</div>
    <div class="edit-row">
      <span class="edit-lbl">G / P</span>
      <button class="edit-btn-sm" onclick="adjustRace('P','w',-1)">-</button>
      <button class="edit-btn-sm" onclick="adjustRace('P','w',1)">+</button>
      <span class="edit-sep">/</span>
      <button class="edit-btn-sm" onclick="adjustRace('P','l',-1)">-</button>
      <button class="edit-btn-sm" onclick="adjustRace('P','l',1)">+</button>
    </div>
    <div class="edit-row edit-sub">vs Zerg</div>
    <div class="edit-row">
      <span class="edit-lbl">G / P</span>
      <button class="edit-btn-sm" onclick="adjustRace('Z','w',-1)">-</button>
      <button class="edit-btn-sm" onclick="adjustRace('Z','w',1)">+</button>
      <span class="edit-sep">/</span>
      <button class="edit-btn-sm" onclick="adjustRace('Z','l',-1)">-</button>
      <button class="edit-btn-sm" onclick="adjustRace('Z','l',1)">+</button>
    </div>
  </div>

  <div id="totals">
    <div class="stat">
      <div class="num" id="total-games">0</div>
      <div class="lbl">Jugadas</div>
    </div>
    <div class="stat wins">
      <div class="num" id="total-wins">0</div>
      <div class="lbl">Ganadas</div>
    </div>
    <div class="stat losses">
      <div class="num" id="total-losses">0</div>
      <div class="lbl">Perdidas</div>
    </div>
  </div>

  <div id="vs-races">
    <div class="vs-row">
      <div class="vs-race"><span class="dot T"></span>vs Terran</div>
      <div class="vs-record"><span class="w" id="T-w">0</span><span class="sep">-</span><span class="l" id="T-l">0</span></div>
    </div>
    <div class="vs-row">
      <div class="vs-race"><span class="dot P"></span>vs Protoss</div>
      <div class="vs-record"><span class="w" id="P-w">0</span><span class="sep">-</span><span class="l" id="P-l">0</span></div>
    </div>
    <div class="vs-row">
      <div class="vs-race"><span class="dot Z"></span>vs Zerg</div>
      <div class="vs-record"><span class="w" id="Z-w">0</span><span class="sep">-</span><span class="l" id="Z-l">0</span></div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   Estadisticas de la jornada (sesion completa, no se resetea entre partidas)
   Lee el mismo archivo status.json que escribe sc2_proxy.py
   Se guarda en localStorage para persistir aunque se recargue la fuente en OBS
   ========================================================================== */

const STORAGE_KEY = 'sc2_session_stats_v1';
const STATUS_FILE = 'status.json';
const POLL_INTERVAL_MS = 1500;

function loadStats() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {
    games: 0, wins: 0, losses: 0,
    vsRace: {
      T: { w: 0, l: 0 },
      P: { w: 0, l: 0 },
      Z: { w: 0, l: 0 }
    },
    lastMatchKey: null,
    lastDisplayTime: 0,
    scoredThisGame: false
  };
}

function saveStats() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
}

let stats = loadStats();

function renderStats() {
  document.getElementById('total-games').textContent = stats.games;
  document.getElementById('total-wins').textContent = stats.wins;
  document.getElementById('total-losses').textContent = stats.losses;
  ['T', 'P', 'Z'].forEach(r => {
    document.getElementById(r + '-w').textContent = stats.vsRace[r].w;
    document.getElementById(r + '-l').textContent = stats.vsRace[r].l;
  });
}

function resetSession() {
  stats = {
    games: 0, wins: 0, losses: 0,
    vsRace: { T: { w: 0, l: 0 }, P: { w: 0, l: 0 }, Z: { w: 0, l: 0 } },
    lastMatchKey: stats.lastMatchKey,
    lastDisplayTime: stats.lastDisplayTime,
    scoredThisGame: false
  };
  saveStats();
  renderStats();
}

function raceCodeFromApi(raceStr) {
  if (!raceStr) return null;
  const s = String(raceStr).toLowerCase();
  if (s.startsWith('terr')) return 'T';
  if (s.startsWith('prot')) return 'P';
  if (s.startsWith('zerg')) return 'Z';
  return null;
}

function setApiConnected(connected) {
  const dot = document.getElementById('api-dot');
  dot.classList.toggle('connected', connected);
}

function setPlayerFound(found) {
  const title = document.getElementById('title');
  if (!title) return;
  title.title = found
    ? ''
    : 'Jugador "' + MY_PLAYER_NAME + '" no encontrado en la partida actual (no se contabiliza)';
  title.style.opacity = found ? '1' : '0.5';
}

function toggleEditPanel() {
  document.getElementById('edit-panel').classList.toggle('hidden');
}

function adjustStat(key, delta) {
  stats[key] = Math.max(0, (stats[key] || 0) + delta);
  if (key === 'wins' || key === 'losses') {
    stats.games = stats.wins + stats.losses;
  }
  saveStats();
  renderStats();
}

function adjustRace(race, kind, delta) {
  stats.vsRace[race][kind] = Math.max(0, (stats.vsRace[race][kind] || 0) + delta);
  saveStats();
  renderStats();
}

/* Registra una partida como jugada, sumando victoria/derrota y el desglose
   contra la raza del oponente. Se usa tanto para partidas resueltas en vivo
   como para partidas resueltas "en diferido" via el mecanismo de resultado
   pendiente (ver mas abajo). */
function scoreGame(result, oppRace) {
  stats.games += 1;
  if (result === 'Victory') {
    stats.wins += 1;
    if (oppRace) stats.vsRace[oppRace].w += 1;
  } else {
    stats.losses += 1;
    if (oppRace) stats.vsRace[oppRace].l += 1;
  }
  stats.scoredThisGame = true;
  stats.pending = null;
  saveStats();
  renderStats();
}

/* Identifica cual de los dos jugadores es "el nuestro" comparando el nombre
   configurado en MY_PLAYER_NAME (arriba en el head) contra los nombres que
   entrega el API de SC2. Esto permite castear/mezclar partidas de distintos
   jugadores del equipo sin que la estadistica se sume al jugador equivocado.
   Devuelve null si el nombre configurado no aparece en esta lectura. */
function identifyMeOpp(players) {
  const configuredName = (MY_PLAYER_NAME || '').trim().toLowerCase();
  const p0Name = (players[0].name || '').trim().toLowerCase();
  const p1Name = (players[1].name || '').trim().toLowerCase();

  if (configuredName && p0Name === configuredName) {
    return { me: players[0], opp: players[1], mePos: 0 };
  }
  if (configuredName && p1Name === configuredName) {
    return { me: players[1], opp: players[0], mePos: 1 };
  }
  return null;
}

/* Compara la partida actual contra el "snapshot" pendiente guardado
   (jugadores, razas y posiciones) para confirmar que se trata exactamente
   de la misma partida antes de contabilizar un resultado que llega
   despues de haber entrado a modo Replay. */
function matchesPending(pending, players) {
  if (!pending) return false;
  return (
    (players[0].name || '') === pending.p0name &&
    (players[1].name || '') === pending.p1name &&
    (players[0].race || '') === pending.p0race &&
    (players[1].race || '') === pending.p1race
  );
}

function handleData(data) {
  if (!data || !Array.isArray(data.players) || data.players.length < 2) return;

  const displayTime = typeof data.displayTime === 'number' ? data.displayTime : null;
  const p0 = data.players[0];
  const p1 = data.players[1];

  // ------------------------------------------------------------------
  // CASO ESPECIAL: la partida entro en modo Replay.
  //
  // Al terminar una partida, si se presiona "Ver repeticion" antes de que
  // el API alcance a reportar Victory/Defeat, SC2 cambia isReplay a true
  // y el resultado puede aparecer recien en esa siguiente lectura (con la
  // MISMA partida, mismos jugadores/razas/posiciones y un displayTime
  // mayor al ultimo que se vio en vivo). En ese caso SI se debe
  // contabilizar, usando el snapshot que se guardo como "pendiente"
  // mientras la partida seguia en vivo con resultado Undecided.
  // ------------------------------------------------------------------
  if (data.isReplay) {
    if (
      stats.pending &&
      !stats.scoredThisGame &&
      matchesPending(stats.pending, data.players) &&
      displayTime !== null &&
      displayTime > stats.pending.displayTime
    ) {
      const identified = identifyMeOpp(data.players);
      if (identified) {
        const { me, opp } = identified;
        let result = me.result;
        if (result !== 'Victory' && result !== 'Defeat') {
          if (opp.result === 'Victory') result = 'Defeat';
          else if (opp.result === 'Defeat') result = 'Victory';
        }
        if (result === 'Victory' || result === 'Defeat') {
          scoreGame(result, raceCodeFromApi(opp.race));
        }
      }
    }
    // Un replay nunca actua como base para detectar la "siguiente partida
    // nueva"; eso se sigue manejando solo cuando vuelva una partida en vivo.
    stats.lastWasReplay = true;
    saveStats();
    return;
  }

  const identified = identifyMeOpp(data.players);
  if (!identified) {
    // No se encontro el nombre configurado en esta partida (por ejemplo,
    // se esta viendo/casteando una partida ajena): no se contabiliza.
    setPlayerFound(false);
    return;
  }
  const { me, opp } = identified;
  setPlayerFound(true);

  const matchKey = (me.name || '') + '|' + (opp.name || '');

  // Umbral de caida de displayTime para considerar que es una partida nueva.
  // Al iniciar una nueva partida, displayTime vuelve a un valor cercano a 0,
  // asi que si baja de forma notoria respecto al ultimo valor visto (incluso
  // contra el mismo rival), lo tratamos como un juego distinto.
  const DISPLAY_TIME_DROP_THRESHOLD = 3;
  const isNewGameByTime =
    displayTime !== null &&
    displayTime < stats.lastDisplayTime - DISPLAY_TIME_DROP_THRESHOLD;

  const isNewMatchup = matchKey && matchKey !== stats.lastMatchKey;

  // Si la ultima lectura valida fue un replay (y no se logro contabilizar
  // via el mecanismo de "pendiente" de arriba), la primera partida en vivo
  // que se vea despues se trata como partida nueva.
  const comingFromReplay = stats.lastWasReplay;

  if (isNewMatchup || isNewGameByTime || comingFromReplay) {
    stats.lastMatchKey = matchKey;
    stats.scoredThisGame = false;
    stats.lastWasReplay = false;
    stats.pending = null;
    saveStats();
  }

  if (displayTime !== null) {
    stats.lastDisplayTime = displayTime;
    saveStats();
  }

  if (stats.scoredThisGame) return;

  const oppRace = raceCodeFromApi(opp.race);

  // A veces el API de SC2 solo actualiza el campo "result" de UNO de los dos
  // jugadores al terminar la partida, dejando al otro en "Undecided". Si eso
  // pasa con nuestro propio jugador, inferimos el resultado a partir del
  // resultado del oponente (si el oponente gano, nosotros perdimos y viceversa).
  let result = me.result;
  if (result !== 'Victory' && result !== 'Defeat') {
    if (opp.result === 'Victory') result = 'Defeat';
    else if (opp.result === 'Defeat') result = 'Victory';
  }

  if (result === 'Victory' || result === 'Defeat') {
    scoreGame(result, oppRace);
  } else if (displayTime !== null) {
    // Todavia sin resultado: guardamos este snapshot como "pendiente" por si
    // la partida pasa a modo Replay antes de que el resultado se confirme.
    stats.pending = {
      p0name: p0.name || '',
      p1name: p1.name || '',
      p0race: p0.race || '',
      p1race: p1.race || '',
      displayTime: displayTime
    };
    saveStats();
  }
}

async function poll() {
  try {
    const res = await fetch(STATUS_FILE + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    setApiConnected(true);
    handleData(data);
  } catch (err) {
    setApiConnected(false);
  }
}

renderStats();
setInterval(poll, POLL_INTERVAL_MS);
poll();
</script>

</body>
</html>
